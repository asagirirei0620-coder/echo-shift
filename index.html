
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080d1c">
<title>ECHO SHIFT 0.3</title>
<style>
:root {
  color-scheme: dark;
  --bg: #080d1c;
  --panel: #111a30;
  --cyan: #61f4ff;
  --purple: #a78bfa;
  --text: #eaf4ff;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  overscroll-behavior: none;
}
body {
  display: flex;
  justify-content: center;
  padding: 12px;
}
#app {
  width: min(100%, 1000px);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
}
.logo {
  font-size: clamp(20px, 4vw, 30px);
  font-weight: 900;
  letter-spacing: 3px;
}
.logo span { color: var(--cyan); }
#status {
  color: #a8bdd9;
  font-size: 12px;
}
#gameWrap {
  position: relative;
  overflow: hidden;
  border: 1px solid #293b60;
  border-radius: 14px;
  background: #080d1c;
  box-shadow: 0 0 35px #13274a80;
}
canvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 16 / 9;
  touch-action: none;
}
#hud {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  background: #10182b;
  border: 1px solid #243451;
  border-radius: 12px;
}
.hudGroup { display: flex; gap: 8px; flex-wrap: wrap; }
.stat {
  font-size: 12px;
  padding: 6px 9px;
  border-radius: 7px;
  background: #1a2943;
  color: #d8e9ff;
}
.stat strong { color: var(--cyan); }
button {
  font: inherit;
  color: var(--text);
  background: #192844;
  border: 1px solid #395071;
  border-radius: 9px;
  padding: 9px 13px;
  cursor: pointer;
  touch-action: manipulation;
}
button:hover { background: #253b60; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
button.primary {
  background: #087e99;
  border-color: #61f4ff;
  font-weight: 800;
}
button:active { transform: scale(.98); }
#controls {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr 1.2fr;
  gap: 8px;
}
.control {
  min-height: 54px;
  font-size: 15px;
  font-weight: 750;
  user-select: none;
  -webkit-user-select: none;
}
.control small {
  display: block;
  font-size: 10px;
  color: #a9c5e8;
  font-weight: 500;
}
#help {
  color: #9db2d0;
  font-size: 12px;
  line-height: 1.65;
  padding: 0 3px;
}
#toast {
  position: fixed;
  z-index: 10;
  left: 50%;
  bottom: 20px;
  transform: translateX(-50%) translateY(20px);
  opacity: 0;
  pointer-events: none;
  background: #142641;
  border: 1px solid var(--cyan);
  color: white;
  padding: 11px 17px;
  border-radius: 10px;
  transition: .2s;
  max-width: 90vw;
  text-align: center;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (min-width: 760px) {
  #controls { grid-template-columns: repeat(4, 1fr); }
  .control { min-height: 48px; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">ECHO <span>SHIFT</span> <small style="font-size:11px;color:#8ca2c2">0.3</small></div>
    <div id="status">GRAVITY IS YOUR KEY</div>
  </header>

  <div id="gameWrap">
    <canvas id="game" width="960" height="540" aria-label="ECHO SHIFT ゲーム画面"></canvas>
  </div>

  <section id="hud">
    <div class="hudGroup">
      <div class="stat">STAGE <strong id="stageStat">—</strong></div>
      <div class="stat">SHARDS <strong id="shardStat">0</strong></div>
      <div class="stat">TIME <strong id="timeStat">00:00</strong></div>
      <div class="stat">GRAVITY <strong id="gravityStat">DOWN</strong></div>
    </div>
    <div class="hudGroup">
      <button id="pauseBtn">Ⅱ 一時停止</button>
      <button id="restartBtn">↻ リスタート</button>
      <button id="saveBtn">保存</button>
    </div>
  </section>

  <section id="controls">
    <button class="control" id="leftBtn">◀ 左<small>A / ←</small></button>
    <button class="control" id="rightBtn">右 ▶<small>D / →</small></button>
    <button class="control" id="jumpBtn">▲ ジャンプ<small>Space / ↑</small></button>
    <button class="control primary" id="shiftBtn">⇅ 重力反転<small>Shift / X</small></button>
  </section>

  <div id="help">
    操作：左右移動で進み、ジャンプと重力反転を使って出口を目指そう。スイッチで扉を開き、危険地帯を避けて、チェックポイントを確保しよう。結晶はスコアに加算される。<br>
    キーボード：← → / A D 移動、Space / ↑ ジャンプ、X / Shift 重力反転、P 一時停止、R リスタート。
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";

(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const W = canvas.width;
  const H = canvas.height;
  const FLOOR_Y = 500;
  const CEILING_Y = 40;
  const SAVE_KEY = "echo_shift_save_03";

  const $ = id => document.getElementById(id);

  const levels = [
    {
      name: "AWAKENING",
      subtitle: "重力を反転させ、出口へ",
      start: { x: 70, y: 448 },
      goal: { x: 870, y: 102, w: 48, h: 58 },
      platforms: [
        { x: 0, y: 500, w: 960, h: 40 },
        { x: 190, y: 420, w: 145, h: 18 },
        { x: 395, y: 345, w: 150, h: 18 },
        { x: 590, y: 270, w: 140, h: 18 },
        { x: 760, y: 195, w: 130, h: 18 },
        { x: 0, y: 40, w: 960, h: 22 }
      ],
      hazards: [
        { x: 345, y: 480, w: 65, h: 20 },
        { x: 540, y: 480, w: 70, h: 20 }
      ],
      switches: [],
      doors: [],
      checkpoints: [{ x: 650, y: 232, w: 20, h: 38 }],
      shards: [{ x: 255, y: 385 }, { x: 465, y: 310 }, { x: 655, y: 235 }]
    },
    {
      name: "LOCKDOWN",
      subtitle: "スイッチで扉を解除しろ",
      start: { x: 65, y: 448 },
      goal: { x: 875, y: 425, w: 44, h: 58 },
      platforms: [
        { x: 0, y: 500, w: 960, h: 40 },
        { x: 140, y: 415, w: 155, h: 18 },
        { x: 350, y: 330, w: 150, h: 18 },
        { x: 530, y: 415, w: 145, h: 18 },
        { x: 700, y: 350, w: 190, h: 18 },
        { x: 0, y: 40, w: 960, h: 22 }
      ],
      hazards: [
        { x: 295, y: 480, w: 65, h: 20 },
        { x: 485, y: 480, w: 70, h: 20 },
        { x: 675, y: 480, w: 65, h: 20 }
      ],
      switches: [{ x: 400, y: 294, w: 28, h: 36, doorId: "A" }],
      doors: [{ id: "A", x: 815, y: 390, w: 22, h: 110, open: false }],
      checkpoints: [{ x: 570, y: 377, w: 20, h: 38 }],
      shards: [{ x: 210, y: 380 }, { x: 425, y: 294 }, { x: 745, y: 315 }]
    },
    {
      name: "ECHO CORE",
      subtitle: "重力を操り、核心へ",
      start: { x: 65, y: 448 },
      goal: { x: 875, y: 240, w: 48, h: 58 },
      platforms: [
        { x: 0, y: 500, w: 960, h: 40 },
        { x: 125, y: 410, w: 120, h: 18 },
        { x: 275, y: 315, w: 130, h: 18 },
        { x: 455, y: 225, w: 130, h: 18 },
        { x: 635, y: 315, w: 130, h: 18 },
        { x: 785, y: 380, w: 110, h: 18 },
        { x: 0, y: 40, w: 960, h: 22 }
      ],
      hazards: [
        { x: 245, y: 480, w: 80, h: 20 },
        { x: 420, y: 480, w: 80, h: 20 },
        { x: 600, y: 480, w: 80, h: 20 },
        { x: 760, y: 480, w: 80, h: 20 }
      ],
      switches: [{ x: 325, y: 279, w: 28, h: 36, doorId: "B" }],
      doors: [{ id: "B", x: 810, y: 185, w: 24, h: 130, open: false }],
      checkpoints: [{ x: 495, y: 187, w: 20, h: 38 }],
      shards: [{ x: 180, y: 375 }, { x: 340, y: 280 }, { x: 520, y: 190 }, { x: 700, y: 280 }]
    },
    {
      name: "FRACTURE",
      subtitle: "反転のタイミングを見極めろ",
      start: { x: 65, y: 448 },
      goal: { x: 875, y: 100, w: 48, h: 58 },
      platforms: [
        { x: 0, y: 500, w: 960, h: 40 },
        { x: 150, y: 425, w: 100, h: 16 },
        { x: 310, y: 350, w: 100, h: 16 },
        { x: 470, y: 275, w: 100, h: 16 },
        { x: 630, y: 200, w: 100, h: 16 },
        { x: 790, y: 145, w: 110, h: 16 },
        { x: 0, y: 40, w: 960, h: 22 }
      ],
      hazards: [
        { x: 255, y: 480, w: 55, h: 20 },
        { x: 415, y: 480, w: 55, h: 20 },
        { x: 575, y: 480, w: 55, h: 20 },
        { x: 735, y: 480, w: 55, h: 20 }
      ],
      switches: [],
      doors: [],
      checkpoints: [{ x: 655, y: 162, w: 20, h: 38 }],
      shards: [{ x: 195, y: 390 }, { x: 355, y: 315 }, { x: 515, y: 240 }, { x: 675, y: 165 }]
    },
    {
      name: "THE LAST SIGNAL",
      subtitle: "すべての反転をつなげ",
      start: { x: 65, y: 448 },
      goal: { x: 870, y: 105, w: 52, h: 60 },
      platforms: [
        { x: 0, y: 500, w: 960, h: 40 },
        { x: 120, y: 420, w: 115, h: 16 },
        { x: 285, y: 340, w: 115, h: 16 },
        { x: 450, y: 260, w: 115, h: 16 },
        { x: 615, y: 340, w: 115, h: 16 },
        { x: 775, y: 220, w: 120, h: 16 },
        { x: 0, y: 40, w: 960, h: 22 }
      ],
      hazards: [
        { x: 235, y: 480, w: 55, h: 20 },
        { x: 400, y: 480, w: 55, h: 20 },
        { x: 565, y: 480, w: 55, h: 20 },
        { x: 730, y: 480, w: 55, h: 20 }
      ],
      switches: [
        { x: 325, y: 304, w: 28, h: 36, doorId: "C" },
        { x: 490, y: 224, w: 28, h: 36, doorId: "D" }
      ],
      doors: [
        { id: "C", x: 575, y: 275, w: 22, h: 65, open: false },
        { id: "D", x: 820, y: 145, w: 22, h: 75, open: false }
      ],
      checkpoints: [{ x: 645, y: 302, w: 20, h: 38 }],
      shards: [{ x: 175, y: 385 }, { x: 340, y: 305 }, { x: 505, y: 225 }, { x: 670, y: 305 }, { x: 830, y: 185 }]
    }
  ];

  let stageIndex = 0;
  let mode = "title";
  let pausedFrom = "playing";
  let stage = null;
  let gravity = 1;
  let shardsCollected = 0;
  let totalShards = 0;
  let elapsed = 0;
  let bestTime = null;
  let cameraShake = 0;
  let flash = 0;
  let particles = [];
  let toastTimer = null;
  let levelStartTime = 0;
  let stageDeaths = 0;
  let transitionTimer = 0;
  let overlayAlpha = 0;
  let jumpQueued = false;
  let shiftQueued = false;
  let interactQueued = false;
  let lastFrame = 0;
  let saveDirty = false;

  const keys = new Set();
  const input = { left: false, right: false, jump: false };

  const player = {
    x: 70, y: 440, w: 28, h: 34,
    vx: 0, vy: 0,
    speed: 265,
    jumpPower: 520,
    grounded: false,
    coyote: 0,
    jumpBuffer: 0,
    invulnerable: 0,
    facing: 1
  };

  let checkpoint = { x: 70, y: 440, gravity: 1 };

  function cloneLevel(index) {
    const source = levels[index];
    return {
      ...source,
      platforms: source.platforms.map(o => ({ ...o })),
      hazards: source.hazards.map(o => ({ ...o })),
      switches: source.switches.map(o => ({ ...o, activated: false })),
      doors: source.doors.map(o => ({ ...o })),
      checkpoints: source.checkpoints.map(o => ({ ...o, activated: false })),
      shards: source.shards.map(o => ({ ...o, collected: false }))
    };
  }

  function showToast(message) {
    const el = $("toast");
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
  }

  function fmtTime(seconds) {
    const s = Math.max(0, Math.floor(seconds));
    return String(Math.floor(s / 60)).padStart(2, "0") + ":" +
      String(s % 60).padStart(2, "0");
  }

  function overlap(a, b) {
    return a.x < b.x + b.w &&
      a.x + a.w > b.x &&
      a.y < b.y + b.h &&
      a.y + a.h > b.y;
  }

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function resetPlayer(position, invulnerable = 0.8) {
    player.x = position.x;
    player.y = position.y;
    player.vx = 0;
    player.vy = 0;
    player.grounded = false;
    player.coyote = 0;
    player.jumpBuffer = 0;
    player.invulnerable = invulnerable;
  }

  function loadStage(index, preserveElapsed = false) {
    stageIndex = clamp(index, 0, levels.length - 1);
    stage = cloneLevel(stageIndex);
    mode = "playing";
    gravity = 1;
    shardsCollected = 0;
    totalShards = stage.shards.length;
    stageDeaths = 0;
    checkpoint = {
      x: stage.start.x,
      y: stage.start.y,
      gravity: 1
    };
    resetPlayer(stage.start, 1);
    particles = [];
    cameraShake = 0;
    flash = 0;
    transitionTimer = 0;
    if (!preserveElapsed) elapsed = 0;
    levelStartTime = elapsed;
    $("status").textContent = stage.name;
    updateHud();
    saveDirty = true;
  }

  function startGame() {
    loadStage(0);
    showToast("ECHO SHIFT 起動");
  }

  function restartStage() {
    if (mode === "title") {
      startGame();
      return;
    }
    if (mode === "victory") {
      loadStage(0);
      return;
    }
    if (mode === "stageclear") {
      loadStage(stageIndex);
      return;
    }
    gravity = checkpoint.gravity;
    resetPlayer(checkpoint, 0.8);
    stageDeaths = Math.max(0, stageDeaths);
    mode = "playing";
    showToast("チェックポイントから再開");
  }

  function setPaused() {
    if (mode === "playing") {
      pausedFrom = "playing";
      mode = "paused";
    } else if (mode === "paused") {
      mode = pausedFrom;
    }
  }

  function toggleGravity() {
    if (mode !== "playing") return;
    gravity *= -1;
    player.vy = 0;
    player.grounded = false;
    player.coyote = 0;
    player.y += gravity === 1 ? 2 : -2;
    flash = 0.18;
    cameraShake = 5;
    burst(player.x + player.w / 2, player.y + player.h / 2, "#61f4ff", 12);
    saveDirty = true;
  }

  function jump() {
    if (mode !== "playing") return;
    player.jumpBuffer = 0.15;
  }

  function burst(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 35 + Math.random() * 180;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 0.35 + Math.random() * 0.5,
        maxLife: 0.85,
        size: 2 + Math.random() * 4,
        color
      });
    }
  }

  function activateSwitch(sw) {
    if (sw.activated) return;
    sw.activated = true;
    const door = stage.doors.find(d => d.id === sw.doorId);
    if (door) door.open = true;
    burst(sw.x + sw.w / 2, sw.y + sw.h / 2, "#a78bfa", 18);
    cameraShake = 3;
    showToast("スイッチ起動 — 扉が開いた");
    saveDirty = true;
  }

  function activateCheckpoint(c) {
    if (c.activated) return;
    c.activated = true;
    checkpoint = {
      x: c.x + c.w / 2 - player.w / 2,
      y: gravity === 1 ? c.y - player.h : c.y + c.h,
      gravity
    };
    burst(c.x + c.w / 2, c.y + c.h / 2, "#69ffb5", 14);
    showToast("チェックポイント確保");
    saveDirty = true;
  }

  function die() {
    if (player.invulnerable > 0 || mode !== "playing") return;
    stageDeaths++;
    cameraShake = 12;
    flash = 0.3;
    burst(player.x + player.w / 2, player.y + player.h / 2, "#ff5577", 20);
    gravity = checkpoint.gravity;
    resetPlayer(checkpoint, 1.1);
    showToast("危険！ チェックポイントから再開");
  }

  function clearStage() {
    if (mode !== "playing") return;
    burst(player.x + player.w / 2, player.y + player.h / 2, "#61f4ff", 35);
    mode = "stageclear";
    transitionTimer = 1.4;
    cameraShake = 5;
    flash = 0.4;
    saveDirty = true;
  }

  function completeGame() {
    mode = "victory";
    bestTime = bestTime === null ? elapsed : Math.min(bestTime, elapsed);
    saveProgress();
    showToast("全ステージクリア！");
  }

  function getSolids() {
    const solids = stage.platforms.slice();
    for (const door of stage.doors) {
      if (!door.open) solids.push(door);
    }
    return solids;
  }

  function movePlayer(dt) {
    const oldX = player.x;
    const oldY = player.y;

    const direction = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    if (direction !== 0) player.facing = direction;

    const accel = player.grounded ? 2200 : 1300;
    const targetVx = direction * player.speed;
    player.vx += clamp(targetVx - player.vx, -accel * dt, accel * dt);

    if (direction === 0) {
      player.vx *= Math.pow(player.grounded ? 0.001 : 0.12, dt);
      if (Math.abs(player.vx) < 4) player.vx = 0;
    }

    player.x += player.vx * dt;
    player.x = clamp(player.x, 0, W - player.w);

    let solids = getSolids();

    for (const s of solids) {
      if (!overlap(player, s)) continue;
      if (player.vx > 0 && oldX + player.w <= s.x + 4) {
        player.x = s.x - player.w;
        player.vx = 0;
      } else if (player.vx < 0 && oldX >= s.x + s.w - 4) {
        player.x = s.x + s.w;
        player.vx = 0;
      } else if (oldY + player.h <= s.y + 8 || oldY >= s.y + s.h - 8) {
        continue;
      } else {
        const leftPen = player.x + player.w - s.x;
        const rightPen = s.x + s.w - player.x;
        player.x = leftPen < rightPen ? s.x - player.w : s.x + s.w;
        player.vx = 0;
      }
    }

    player.vy += gravity * 1450 * dt;
    player.vy = clamp(player.vy, -760, 760);
    player.y += player.vy * dt;
    player.grounded = false;

    for (const s of solids) {
      if (!overlap(player, s)) continue;

      if (gravity === 1 && player.vy >= 0 && oldY + player.h <= s.y + 12) {
        player.y = s.y - player.h;
        player.vy = 0;
        player.grounded = true;
      } else if (gravity === -1 && player.vy <= 0 && oldY >= s.y + s.h - 12) {
        player.y = s.y + s.h;
        player.vy = 0;
        player.grounded = true;
      } else {
        const topPen = player.y + player.h - s.y;
        const bottomPen = s.y + s.h - player.y;
        if (topPen < bottomPen) player.y = s.y - player.h;
        else player.y = s.y + s.h;
        player.vy = 0;
      }
    }

    if (player.grounded) player.coyote = 0.11;
    else player.coyote = Math.max(0, player.coyote - dt);

    player.jumpBuffer = Math.max(0, player.jumpBuffer - dt);
    if (player.jumpBuffer > 0 && (player.grounded || player.coyote > 0)) {
      player.vy = -gravity * player.jumpPower;
      player.grounded = false;
      player.coyote = 0;
      player.jumpBuffer = 0;
      burst(player.x + player.w / 2, gravity === 1 ? player.y + player.h : player.y, "#d9fbff", 5);
    }

    player.invulnerable = Math.max(0, player.invulnerable - dt);

    if (player.y > H + 80 || player.y + player.h < -80) {
      die();
      return;
    }

    for (const hazard of stage.hazards) {
      if (overlap(player, hazard)) {
        die();
        return;
      }
    }

    for (const sw of stage.switches) {
      if (overlap(player, sw)) activateSwitch(sw);
    }

    for (const c of stage.checkpoints) {
      if (overlap(player, c)) activateCheckpoint(c);
    }

    for (const shard of stage.shards) {
      if (shard.collected) continue;
      const box = { x: shard.x - 10, y: shard.y - 10, w: 20, h: 20 };
      if (overlap(player, box)) {
        shard.collected = true;
        shardsCollected++;
        burst(shard.x, shard.y, "#ffe98a", 12);
        showToast("結晶 +1");
        saveDirty = true;
      }
    }

    if (overlap(player, stage.goal)) clearStage();

    if (player.x !== oldX || player.y !== oldY) saveDirty = true;
  }

  function update(dt) {
    if (mode === "playing") {
      elapsed += dt;
      movePlayer(dt);
    } else if (mode === "stageclear") {
      transitionTimer -= dt;
      if (transitionTimer <= 0) {
        if (stageIndex < levels.length - 1) {
          loadStage(stageIndex + 1, true);
        } else {
          completeGame();
        }
      }
    }

    cameraShake = Math.max(0, cameraShake - dt * 28);
    flash = Math.max(0, flash - dt);

    for (const p of particles) {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= Math.pow(0.2, dt);
      p.vy *= Math.pow(0.2, dt);
      p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);

    updateHud();

    if (saveDirty && mode === "playing") {
      saveDirty = false;
      saveProgress();
    }
  }

  function updateHud() {
    $("stageStat").textContent = stage ? `${stageIndex + 1}/${levels.length}` : "—";
    $("shardStat").textContent = String(shardsCollected);
    $("timeStat").textContent = fmtTime(elapsed);
    $("gravityStat").textContent = gravity === 1 ? "DOWN" : "UP";
    $("pauseBtn").textContent = mode === "paused" ? "▶ 再開" : "Ⅱ 一時停止";
  }

  function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, H);
    gradient.addColorStop(0, "#080d1c");
    gradient.addColorStop(0.55, "#101a32");
    gradient.addColorStop(1, "#080d1c");
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    for (let i = 0; i < 90; i++) {
      const x = (i * 137.5 + 17) % W;
      const y = (i * 79.3 + 13) % H;
      const twinkle = 0.35 + 0.65 * Math.abs(Math.sin(elapsed * 1.3 + i));
      ctx.globalAlpha = twinkle * 0.7;
      ctx.fillStyle = i % 5 === 0 ? "#61f4ff" : "#a8c7ff";
      ctx.fillRect(x, y, i % 7 === 0 ? 2 : 1, i % 7 === 0 ? 2 : 1);
    }
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.07;
    ctx.strokeStyle = "#61f4ff";
    ctx.lineWidth = 1;
    const offset = (elapsed * 12) % 48;
    for (let x = -48 + offset; x < W + 48; x += 48) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    for (let y = 0; y < H; y += 48) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPlatform(p) {
    const gradient = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
    gradient.addColorStop(0, "#284568");
    gradient.addColorStop(0.2, "#182d4b");
    gradient.addColorStop(1, "#0d1729");
    ctx.fillStyle = gradient;
    ctx.fillRect(p.x, p.y, p.w, p.h);
    ctx.fillStyle = "#61f4ff";
    ctx.globalAlpha = 0.8;
    ctx.fillRect(p.x, p.y, p.w, 3);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "#3a6585";
    ctx.strokeRect(p.x + .5, p.y + .5, p.w - 1, p.h - 1);
    ctx.fillStyle = "#54769a";
    for (let x = p.x + 10; x < p.x + p.w - 5; x += 28) {
      ctx.fillRect(x, p.y + p.h - 4, 10, 1);
    }
  }

  function drawHazard(h) {
    ctx.save();
    ctx.shadowBlur = 14;
    ctx.shadowColor = "#ff466b";
    const g = ctx.createLinearGradient(h.x, h.y, h.x, h.y + h.h);
    g.addColorStop(0, "#ff8295");
    g.addColorStop(1, "#8b173e");
    ctx.fillStyle = g;
    ctx.fillRect(h.x, h.y, h.w, h.h);
    ctx.fillStyle = "#ffd0d7";
    for (let x = h.x + 3; x < h.x + h.w - 3; x += 12) {
      ctx.beginPath();
      ctx.moveTo(x, h.y + h.h);
      ctx.lineTo(x + 6, h.y + 3);
      ctx.lineTo(x + 10, h.y + h.h);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawDoor(d) {
    if (d.open) {
      ctx.save();
      ctx.globalAlpha = 0.18 + Math.sin(elapsed * 5) * 0.06;
      ctx.fillStyle = "#a78bfa";
      ctx.fillRect(d.x, d.y, d.w, d.h);
      ctx.restore();
      return;
    }
    ctx.save();
    ctx.shadowBlur = 12;
    ctx.shadowColor = "#a78bfa";
    ctx.fillStyle = "#4c2b80";
    ctx.fillRect(d.x, d.y, d.w, d.h);
    ctx.fillStyle = "#bba5ff";
    ctx.fillRect(d.x + 4, d.y + 4, d.w - 8, d.h - 8);
    ctx.fillStyle = "#30204e";
    for (let y = d.y + 10; y < d.y + d.h; y += 14) {
      ctx.fillRect(d.x + 3, y, d.w - 6, 3);
    }
    ctx.restore();
  }

  function drawSwitch(sw) {
    ctx.save();
    ctx.shadowBlur = sw.activated ? 16 : 7;
    ctx.shadowColor = sw.activated ? "#61ffbd" : "#a78bfa";
    ctx.fillStyle = sw.activated ? "#52ffc0" : "#7357ba";
    ctx.fillRect(sw.x, sw.y, sw.w, sw.h);
    ctx.fillStyle = sw.activated ? "#d8fff0" : "#d6c7ff";
    ctx.fillRect(sw.x + 5, sw.y + 5, sw.w - 10, 7);
    ctx.fillStyle = "#141d32";
    ctx.fillRect(sw.x + 6, sw.y + 17, sw.w - 12, 12);
    ctx.restore();
  }

  function drawCheckpoint(c) {
    ctx.save();
    ctx.shadowBlur = c.activated ? 18 : 5;
    ctx.shadowColor = "#69ffb5";
    ctx.fillStyle = c.activated ? "#69ffb5" : "#447e81";
    ctx.fillRect(c.x, c.y, c.w, c.h);
    ctx.fillStyle = "#eafff6";
    ctx.fillRect(c.x + 4, c.y + 5, c.w - 8, 4);
    ctx.beginPath();
    ctx.moveTo(c.x + c.w / 2, c.y + 10);
    ctx.lineTo(c.x + c.w / 2, c.y + 27);
    ctx.strokeStyle = "#eafff6";
    ctx.stroke();
    ctx.restore();
  }

  function drawShard(s) {
    if (s.collected) return;
    const bob = Math.sin(elapsed * 3 + s.x * 0.02) * 4;
    ctx.save();
    ctx.translate(s.x, s.y + bob);
    ctx.rotate(elapsed * 0.7);
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#ffe98a";
    ctx.fillStyle = "#fff0a1";
    ctx.beginPath();
    ctx.moveTo(0, -11);
    ctx.lineTo(8, -2);
    ctx.lineTo(5, 9);
    ctx.lineTo(-5, 9);
    ctx.lineTo(-8, -2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.globalAlpha = 0.8;
    ctx.fillRect(-1, -7, 2, 10);
    ctx.restore();
  }

  function drawGoal(g) {
    const pulse = 1 + Math.sin(elapsed * 3) * 0.06;
    ctx.save();
    ctx.translate(g.x + g.w / 2, g.y + g.h / 2);
    ctx.scale(pulse, pulse);
    ctx.shadowBlur = 22;
    ctx.shadowColor = "#61f4ff";
    ctx.strokeStyle = "#61f4ff";
    ctx.lineWidth = 3;
    ctx.strokeRect(-g.w / 2, -g.h / 2, g.w, g.h);
    ctx.fillStyle = "#61f4ff20";
    ctx.fillRect(-g.w / 2, -g.h / 2, g.w, g.h);
    ctx.beginPath();
    ctx.arc(0, 0, 10 + Math.sin(elapsed * 5) * 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-7, 0);
    ctx.lineTo(7, 0);
    ctx.moveTo(0, -7);
    ctx.lineTo(0, 7);
    ctx.stroke();
    ctx.restore();
  }

  function drawPlayer() {
    if (player.invulnerable > 0 && Math.floor(elapsed * 18) % 2 === 0) return;
    ctx.save();
    const x = player.x;
    const y = player.y;
    ctx.shadowBlur = 18;
    ctx.shadowColor = "#61f4ff";
    const grad = ctx.createLinearGradient(x, y, x + player.w, y + player.h);
    grad.addColorStop(0, "#e5ffff");
    grad.addColorStop(0.45, "#61f4ff");
    grad.addColorStop(1, "#1d8bb6");
    ctx.fillStyle = grad;
    ctx.fillRect(x + 3, y + 3, player.w - 6, player.h - 6);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#092139";
    const eyeX = player.facing > 0 ? x + 16 : x + 6;
    ctx.fillRect(eyeX, y + 10, 6, 4);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(eyeX + 1, y + 10, 2, 2);
    ctx.fillStyle = "#c9ffff";
    ctx.fillRect(x + 6, y + player.h - 5, player.w - 12, 2);
    ctx.restore();
  }

  function drawParticles() {
    ctx.save();
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
      ctx.fillStyle = p.color;
      ctx.shadowBlur = 8;
      ctx.shadowColor = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.restore();
  }

  function drawWorld() {
    if (!stage) return;
    for (const p of stage.platforms) drawPlatform(p);
    for (const h of stage.hazards) drawHazard(h);
    for (const d of stage.doors) drawDoor(d);
    for (const sw of stage.switches) drawSwitch(sw);
    for (const c of stage.checkpoints) drawCheckpoint(c);
    for (const s of stage.shards) drawShard(s);
    drawGoal(stage.goal);
    drawPlayer();
    drawParticles();

    ctx.save();
    ctx.fillStyle = "#d9e8ff";
    ctx.font = "700 16px system-ui";
    ctx.fillText(stage.name, 24, 29);
    ctx.fillStyle = "#8da9ce";
    ctx.font = "12px system-ui";
    ctx.fillText(stage.subtitle, 24, 48);
    ctx.restore();
  }

  function drawCenteredPanel(title, lines, buttonText) {
    ctx.save();
    ctx.fillStyle = "#050914c9";
    ctx.fillRect(0, 0, W, H);

    const panelW = Math.min(650, W - 40);
    const panelH = Math.min(340, 110 + lines.length * 30);
    const px = (W - panelW) / 2;
    const py = (H - panelH) / 2;

    ctx.shadowBlur = 30;
    ctx.shadowColor = "#244e85";
    ctx.fillStyle = "#101b31";
    ctx.fillRect(px, py, panelW, panelH);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "#36557d";
    ctx.lineWidth = 2;
    ctx.strokeRect(px, py, panelW, panelH);

    ctx.textAlign = "center";
    ctx.fillStyle = "#61f4ff";
    ctx.font = "900 36px system-ui";
    ctx.fillText(title, W / 2, py + 57);

    ctx.fillStyle = "#c5d7ef";
    ctx.font = "15px system-ui";
    lines.forEach((line, i) => ctx.fillText(line, W / 2, py + 100 + i * 27));

    if (buttonText) {
      ctx.fillStyle = "#0b7e98";
      ctx.fillRect(W / 2 - 125, py + panelH - 57, 250, 38);
      ctx.strokeStyle = "#61f4ff";
      ctx.strokeRect(W / 2 - 125, py + panelH - 57, 250, 38);
      ctx.fillStyle = "#ffffff";
      ctx.font = "800 16px system-ui";
      ctx.fillText(buttonText, W / 2, py + panelH - 32);
    }
    ctx.restore();
  }

  function render() {
    ctx.save();
    if (cameraShake > 0) {
      ctx.translate(
        (Math.random() - 0.5) * cameraShake,
        (Math.random() - 0.5) * cameraShake
      );
    }

    drawBackground();

    if (mode === "title") {
      drawCenteredPanel("ECHO SHIFT", [
        "重力を反転させ、出口を目指せ。",
        "スイッチ、危険地帯、結晶を突破しよう。",
        "全5ステージ / セーブ対応 / iPad操作対応"
      ], "タップ / Space でスタート");
    } else {
      drawWorld();

      if (mode === "paused") {
        drawCenteredPanel("PAUSED", [
          "ゲームは一時停止中。",
          "再開ボタンまたは P キーで続行。"
        ], "再開");
      } else if (mode === "stageclear") {
        drawCenteredPanel("STAGE CLEAR", [
          stage.name,
          `結晶 ${shardsCollected} / ${totalShards}`,
          "次のステージへ移動中..."
        ], "");
      } else if (mode === "victory") {
        drawCenteredPanel("ALL CLEAR", [
          "全ステージをクリアした！",
          `タイム: ${fmtTime(elapsed)}`,
          `結晶: ${totalShardsCollectedInRun()} 個`,
          bestTime === null ? "" : `ベストタイム: ${fmtTime(bestTime)}`
        ].filter(Boolean), "タップ / Space で再挑戦");
      }
    }

    if (flash > 0) {
      ctx.fillStyle = `rgba(97,244,255,${Math.min(0.28, flash * 0.8)})`;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
  }

  function totalShardsCollectedInRun() {
    return runShardCount;
  }

  let runShardCount = 0;
  const originalLoadStage = loadStage;

  function loadStageWithRunCount(index, preserveElapsed = false) {
    originalLoadStage(index, preserveElapsed);
  }

  function saveProgress() {
    try {
      const data = {
        version: 3,
        stageIndex,
        elapsed,
        shardsCollected,
        runShardCount,
        gravity,
        checkpoint,
        player: { x: player.x, y: player.y },
        stage: stage ? {
          switches: stage.switches.map(s => s.activated),
          doors: stage.doors.map(d => d.open),
          checkpoints: stage.checkpoints.map(c => c.activated),
          shards: stage.shards.map(s => s.collected)
        } : null,
        bestTime,
        mode: mode === "victory" ? "victory" : "playing"
      };
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    } catch (error) {
      console.warn("セーブに失敗しました:", error);
    }
  }

  function restoreProgress() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      const data = JSON.parse(raw);
      if (!data || data.version !== 3 ||
          !Number.isInteger(data.stageIndex) ||
          data.stageIndex < 0 || data.stageIndex >= levels.length) {
        return false;
      }

      loadStage(data.stageIndex, true);
      elapsed = Number.isFinite(data.elapsed) ? Math.max(0, data.elapsed) : 0;
      shardsCollected = Number.isFinite(data.shardsCollected) ? data.shardsCollected : 0;
      runShardCount = Number.isFinite(data.runShardCount) ? data.runShardCount : shardsCollected;
      gravity = data.gravity === -1 ? -1 : 1;

      if (data.checkpoint && Number.isFinite(data.checkpoint.x) &&
          Number.isFinite(data.checkpoint.y)) {
        checkpoint = {
          x: clamp(data.checkpoint.x, 0, W - player.w),
          y: clamp(data.checkpoint.y, -100, H + 100),
          gravity: data.checkpoint.gravity === -1 ? -1 : 1
        };
      }

      if (data.stage) {
        stage.switches.forEach((s, i) => {
          s.activated = Boolean(data.stage.switches?.[i]);
        });
        stage.doors.forEach(d => {
          const matching = stage.switches.find(s => s.doorId === d.id && s.activated);
          d.open = Boolean(matching);
        });
        stage.checkpoints.forEach((c, i) => {
          c.activated = Boolean(data.stage.checkpoints?.[i]);
        });
        stage.shards.forEach((s, i) => {
          s.collected = Boolean(data.stage.shards?.[i]);
        });
      }

      if (data.player && Number.isFinite(data.player.x) && Number.isFinite(data.player.y)) {
        resetPlayer({
          x: clamp(data.player.x, 0, W - player.w),
          y: clamp(data.player.y, -100, H + 100)
        }, 0.6);
      } else {
        resetPlayer(checkpoint, 0.6);
      }

      bestTime = Number.isFinite(data.bestTime) ? data.bestTime : null;
      if (data.mode === "victory") mode = "victory";
      updateHud();
      return true;
    } catch (error) {
      console.warn("セーブデータの読み込みに失敗しました:", error);
      return false;
    }
  }

  function bindHoldButton(id, property) {
    const button = $(id);
    const down = event => {
      event.preventDefault();
      input[property] = true;
      try { button.setPointerCapture(event.pointerId); } catch (_) {}
    };
    const up = event => {
      event.preventDefault();
      input[property] = false;
    };
    button.addEventListener("pointerdown", down);
    button.addEventListener("pointerup", up);
    button.addEventListener("pointercancel", up);
    button.addEventListener("lostpointercapture", up);
    button.addEventListener("contextmenu", event => event.preventDefault());
  }

  bindHoldButton("leftBtn", "left");
  bindHoldButton("rightBtn", "right");

  $("jumpBtn").addEventListener("pointerdown", event => {
    event.preventDefault();
    jump();
  });
  $("shiftBtn").addEventListener("pointerdown", event => {
    event.preventDefault();
    toggleGravity();
  });

  $("pauseBtn").addEventListener("click", setPaused);
  $("restartBtn").addEventListener("click", restartStage);
  $("saveBtn").addEventListener("click", () => {
    saveProgress();
    showToast("進行状況を保存しました");
  });

  canvas.addEventListener("pointerdown", event => {
    event.preventDefault();
    if (mode === "title") {
      startGame();
    } else if (mode === "paused") {
      mode = "playing";
    } else if (mode === "victory") {
      runShardCount = 0;
      loadStage(0);
    } else if (mode === "playing") {
      const rect = canvas.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width * W;
      if (x < W * 0.32) input.left = true;
      else if (x < W * 0.58) jump();
      else if (x < W * 0.78) input.right = true;
      else toggleGravity();
    }
  });
  canvas.addEventListener("pointerup", () => {
    input.left = false;
    input.right = false;
  });
  canvas.addEventListener("pointercancel", () => {
    input.left = false;
    input.right = false;
  });
  canvas.addEventListener("contextmenu", event => event.preventDefault());

  window.addEventListener("keydown", event => {
    const k = event.key.toLowerCase();
    if (["arrowleft", "arrowright", "arrowup", " ", "shift"].includes(k)) {
      event.preventDefault();
    }

    if (keys.has(k)) return;
    keys.add(k);

    if (k === "arrowleft" || k === "a") input.left = true;
    if (k === "arrowright" || k === "d") input.right = true;

    if (k === " " || k === "arrowup" || k === "w") {
      if (mode === "title") startGame();
      else if (mode === "victory") {
        runShardCount = 0;
        loadStage(0);
      } else jump();
    }

    if (k === "x" || k === "shift") toggleGravity();
    if (k === "p" || k === "escape") setPaused();
    if (k === "r") restartStage();
    if (k === "e" && mode === "title") startGame();
  });

  window.addEventListener("keyup", event => {
    const k = event.key.toLowerCase();
    keys.delete(k);
    if (k === "arrowleft" || k === "a") input.left = false;
    if (k === "arrowright" || k === "d") input.right = false;
  });

  window.addEventListener("blur", () => {
    input.left = false;
    input.right = false;
    keys.clear();
    if (mode === "playing") {
      pausedFrom = "playing";
      mode = "paused";
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && mode === "playing") {
      pausedFrom = "playing";
      mode = "paused";
    }
  });

  function gameLoop(timestamp) {
    const dt = lastFrame === 0 ? 0 : Math.min(0.033, (timestamp - lastFrame) / 1000);
    lastFrame = timestamp;
    update(dt);
    render();
    requestAnimationFrame(gameLoop);
  }

  function boot() {
    stage = cloneLevel(0);
    const restored = restoreProgress();
    if (!restored) {
      mode = "title";
      stage = cloneLevel(0);
      $("status").textContent = "GRAVITY IS YOUR KEY";
    }
    updateHud();
    requestAnimationFrame(gameLoop);
  }

  boot();
})();
</script>
</body>
</html>
